<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山村『日⇔西』単語帳 - Cloud Sync Edition</title>

    <link rel="icon" type="image/png"
        href="https://drive.google.com/uc?export=download&id=180AQNCjqhxGQ2xFPOaMOFtZ12Bn4Lq-L">
    <link rel="apple-touch-icon"
        href="https://drive.google.com/uc?export=download&id=180AQNCjqhxGQ2xFPOaMOFtZ12Bn4Lq-L">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #020617;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        /* 背景のアニメーション星空 */
        @keyframes drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-1000px);
            }
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2000px;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png') repeat;
            animation: drift 100s linear infinite;
            z-index: 0;
            opacity: 0.2;
        }

        /* カードのスタイル */
        .card-container {
            perspective: 2000px;
            width: 100%;
            max-width: 360px;
            height: 420px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .card-face-front {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
            backdrop-filter: blur(20px);
            border-top: 2px solid rgba(34, 211, 238, 0.5);
        }

        .card-face-back {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(88, 28, 135, 0.8));
            backdrop-filter: blur(20px);
            transform: rotateY(180deg);
            border-top: 2px solid rgba(168, 85, 247, 0.5);
        }

        ruby {
            ruby-align: center;
            ruby-position: over;
        }

        rt {
            font-size: 0.4em;
            letter-spacing: 0.1em;
            color: rgba(168, 85, 247, 1);
            font-weight: bold;
            padding-bottom: 0.2em;
        }

        .glass-ui {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-active {
            background-color: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }

        .romaji {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: rgba(148, 163, 184, 0.8);
            margin-top: 0.5rem;
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col items-center justify-between py-6 px-6 overflow-hidden">

    <div class="stars"></div>

    <div class="z-10 text-center w-full space-y-4">
        <div>
            <h1
                class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                山村『日⇔西』単語帳
            </h1>
            <p id="stats-display" class="text-[8px] text-slate-500 font-mono mt-1 uppercase tracking-widest">
                Initialising Cloud Data...</p>
        </div>

        <div class="flex items-center gap-2 max-w-xs mx-auto">
            <select id="category-select"
                class="flex-1 glass-ui rounded-xl px-4 py-3 text-[10px] font-bold tracking-widest uppercase outline-none text-cyan-400 border-cyan-500/30 bg-slate-900">
                <option value="">Connecting...</option>
            </select>
            <button id="btn-sync"
                class="w-12 h-12 rounded-xl glass-ui flex flex-col items-center justify-center active:bg-cyan-500/20 border-cyan-500/30">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-cyan-400"></i>
            </button>
        </div>

        <div class="flex justify-center gap-2">
            <button id="mode-es-ja"
                class="btn-active px-4 py-1.5 rounded-full border border-white/10 text-[10px] font-bold tracking-widest uppercase transition-all glass-ui">
                西 → 日
            </button>
            <button id="mode-ja-es"
                class="px-4 py-1.5 rounded-full border border-white/10 text-[10px] font-bold tracking-widest uppercase transition-all glass-ui text-slate-400">
                日 → 西
            </button>
        </div>
    </div>

    <div class="z-10 w-full flex justify-center">
        <div class="card-container">
            <div id="card-inner" class="card-inner">
                <div class="card-face card-face-front">
                    <div
                        class="absolute top-8 left-8 text-[10px] font-bold tracking-widest text-cyan-400 opacity-50 uppercase">
                        FRONT</div>
                    <div class="flex flex-col items-center">
                        <h2 id="front-text" class="text-4xl font-bold text-center leading-tight px-4">読み込み中...</h2>
                        <div id="front-romaji" class="romaji"></div>
                    </div>
                    <button id="speak-front"
                        class="absolute bottom-10 w-12 h-12 rounded-full glass-ui flex items-center justify-center border-cyan-500/30 active:scale-95 transition-transform">
                        <i data-lucide="volume-2" class="w-5 h-5 text-cyan-400"></i>
                    </button>
                </div>
                <div class="card-face card-face-back">
                    <div
                        class="absolute top-8 left-8 text-[10px] font-bold tracking-widest text-purple-400 opacity-50 uppercase">
                        BACK</div>
                    <div class="flex flex-col items-center">
                        <h2 id="back-text" class="text-3xl font-bold text-center leading-tight px-4">...</h2>
                        <div id="back-romaji" class="romaji"></div>
                    </div>
                    <button id="speak-back"
                        class="absolute bottom-10 w-12 h-12 rounded-full glass-ui flex items-center justify-center border-purple-500/30 active:scale-95 transition-transform">
                        <i data-lucide="volume-2" class="w-5 h-5 text-purple-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="z-10 w-full max-w-sm space-y-6">
        <div class="flex items-center justify-between gap-4">
            <button id="btn-prev"
                class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-left" class="w-8 h-8 text-slate-400"></i>
            </button>
            <div class="text-center flex-1">
                <div id="counter" class="text-2xl font-['Orbitron'] font-bold text-white tracking-widest">0000</div>
                <div class="w-full h-1 bg-slate-900 rounded-full mt-3 overflow-hidden">
                    <div id="progress-bar"
                        class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 w-0 transition-all duration-300">
                    </div>
                </div>
            </div>
            <button id="btn-next"
                class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-right" class="w-8 h-8 text-slate-400"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button id="btn-shuffle"
                class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">
                <i data-lucide="shuffle" class="w-4 h-4 text-cyan-400"></i> Shuffle
            </button>
            <button id="btn-open-jump"
                class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">
                <i data-lucide="hash" class="w-4 h-4 text-purple-400"></i> Jump
            </button>
        </div>
    </div>

    <div id="jump-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="glass-ui p-6 rounded-[2rem] w-80 text-center transform scale-95 transition-transform duration-300 border border-white/10"
            id="jump-modal-content">
            <h3 class="text-lg font-bold text-white mb-1 font-['Orbitron'] tracking-wider">JUMP TO</h3>
            <p class="text-[10px] text-slate-400 mb-6 uppercase tracking-widest">番号を入力 (1 - <span
                    id="jump-max-display"></span>)</p>
            <input type="number" id="jump-input"
                class="w-full bg-slate-900/50 border border-purple-500/30 rounded-xl px-4 py-4 text-center text-white font-bold text-2xl outline-none mb-6 font-['Orbitron']"
                placeholder="#">
            <div class="flex gap-3">
                <button id="btn-jump-cancel"
                    class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-bold text-slate-400 tracking-widest uppercase">CANCEL</button>
                <button id="btn-jump-confirm"
                    class="flex-1 py-3 rounded-xl bg-purple-500/20 border border-purple-500/50 text-purple-300 text-[10px] font-bold tracking-widest uppercase">GO</button>
            </div>
        </div>
    </div>

    <div id="toast"
        class="fixed bottom-32 glass-ui px-6 py-2 rounded-full text-[10px] font-bold tracking-widest uppercase opacity-0 transition-all duration-300 pointer-events-none text-cyan-400">
        Message
    </div>

    <script>
        // デプロイIDに基づいたウェブアプリのURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwnDFdkIKNT0-ajYvc31cZ8Bg9xuCRCeSTZa1iX5eJ5CUgYvT_gmyi-2DHQMJ1i11gB/exec";

        let vocabularyData = {};
        let currentCat = '';
        let vocabulary = [];
        let index = 0;
        let isFlipped = false;
        let mode = 'es-ja';

        // スプレッドシートからデータを取得
        async function fetchSheetData() {
            const stats = document.getElementById('stats-display');
            stats.textContent = "SYNCING WITH CLOUD...";

            try {
                // GAS側の doGet(e) で fetch パラメータを判別するために付与
                const response = await fetch(GAS_URL + "?fetch=true");
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                vocabularyData = data;

                // カテゴリセレクトボックスを動的に生成
                const select = document.getElementById('category-select');
                const prevValue = select.value;
                select.innerHTML = '';

                const categories = Object.keys(vocabularyData);
                categories.forEach((cat) => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    // シート名から数字を抽出して整形 (例: "01入門" -> "SECTION 01")
                    const match = cat.match(/^(\d+)/);
                    if (match) {
                        opt.textContent = `SECTION ${match[1]}`;
                    } else {
                        opt.textContent = cat;
                    }
                    select.appendChild(opt);
                });

                const categories = Object.keys(vocabularyData);
                categories.forEach((cat) => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    // シート名から数字を抽出して整形 (例: "01入門" -> "SECTION 01")
                    const match = cat.match(/^(\d+)/);
                    if (match) {
                        opt.textContent = `SECTION ${match[1]}`;
                    } else {
                        opt.textContent = cat;
                    }
                    select.appendChild(opt);
                });

                // カテゴリの復元または初期化
                if (prevValue && vocabularyData[prevValue]) {
                    select.value = prevValue;
                    currentCat = prevValue;
                } else {
                    currentCat = categories[0];
                }

                vocabulary = vocabularyData[currentCat];
                update();
                toast("CLOUD SYNC COMPLETE");
            } catch (e) {
                console.error("Sync Error:", e);
                stats.textContent = "CONNECTION ERROR";
                toast("SYNC FAILED");
            }
        }

        const update = () => {
            if (!vocabulary || vocabulary.length === 0) return;
            const word = vocabulary[index];
            const frontText = document.getElementById('front-text');
            const frontRomaji = document.getElementById('front-romaji');
            const backText = document.getElementById('back-text');
            const backRomaji = document.getElementById('back-romaji');

            if (mode === 'es-ja') {
                frontText.innerHTML = word.es;
                frontRomaji.textContent = "";
                backText.innerHTML = word.ja;
                backRomaji.textContent = word.romaji || "";
            } else {
                frontText.innerHTML = word.ja;
                frontRomaji.textContent = word.romaji || "";
                backText.innerHTML = word.es;
                backRomaji.textContent = "";
            }

            document.getElementById('counter').textContent = (index + 1).toString().padStart(4, '0');
            document.getElementById('progress-bar').style.width = `${((index + 1) / vocabulary.length) * 100}%`;
            document.getElementById('stats-display').textContent = `LIVE DATA | ${currentCat.toUpperCase()} | ${vocabulary.length} WORDS`;
        };

        const toast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        };

        // TTS音声読み上げ
        const getSpeakText = (htmlContent, isJapanese) => {
            const temp = document.createElement('div');
            temp.innerHTML = htmlContent;
            if (!isJapanese) return temp.textContent;
            let speakable = "";
            temp.childNodes.forEach(node => {
                if (node.nodeName === 'RUBY') {
                    const rt = node.querySelector('rt');
                    speakable += rt ? rt.textContent : node.textContent;
                } else {
                    speakable += node.textContent;
                }
            });
            return speakable || temp.textContent;
        };

        const speak = (rawHtml, lang) => {
            if (!window.speechSynthesis) { toast("TTS NOT SUPPORTED"); return; }
            window.speechSynthesis.cancel();
            const textToSpeak = getSpeakText(rawHtml, lang === 'ja-JP');
            const u = new SpeechSynthesisUtterance(textToSpeak);
            u.lang = lang;
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        };

        // イベント
        document.getElementById('card-inner').addEventListener('click', () => {
            isFlipped = !isFlipped;
            document.getElementById('card-inner').classList.toggle('is-flipped', isFlipped);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            isFlipped = false;
            document.getElementById('card-inner').classList.remove('is-flipped');
            setTimeout(() => { index = (index + 1) % vocabulary.length; update(); }, 200);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            isFlipped = false;
            document.getElementById('card-inner').classList.remove('is-flipped');
            setTimeout(() => { index = (index - 1 + vocabulary.length) % vocabulary.length; update(); }, 200);
        });

        document.getElementById('category-select').addEventListener('change', (e) => {
            currentCat = e.target.value;
            vocabulary = vocabularyData[currentCat];
            index = 0;
            isFlipped = false;
            document.getElementById('card-inner').classList.remove('is-flipped');
            update();
            toast(`LOADED: ${currentCat}`);
        });

        document.getElementById('btn-sync').addEventListener('click', fetchSheetData);

        document.getElementById('mode-es-ja').addEventListener('click', () => {
            mode = 'es-ja';
            document.getElementById('mode-es-ja').classList.add('btn-active');
            document.getElementById('mode-ja-es').classList.remove('btn-active');
            update();
        });

        document.getElementById('mode-ja-es').addEventListener('click', () => {
            mode = 'ja-es';
            document.getElementById('mode-ja-es').classList.add('btn-active');
            document.getElementById('mode-es-ja').classList.remove('btn-active');
            update();
        });

        document.getElementById('btn-shuffle').addEventListener('click', () => {
            index = Math.floor(Math.random() * vocabulary.length);
            update();
            toast("SHUFFLED");
        });

        const modal = document.getElementById('jump-modal');
        const modalContent = document.getElementById('jump-modal-content');
        document.getElementById('btn-open-jump').addEventListener('click', () => {
            document.getElementById('jump-max-display').textContent = vocabulary.length;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                document.getElementById('jump-input').focus();
            }, 10);
        });

        document.getElementById('btn-jump-cancel').addEventListener('click', () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        });

        document.getElementById('btn-jump-confirm').addEventListener('click', () => {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= vocabulary.length) {
                index = val - 1;
                update();
                document.getElementById('btn-jump-cancel').click();
                toast(`JUMPED TO #${val}`);
            }
        });

        document.getElementById('speak-front').addEventListener('click', (e) => {
            e.stopPropagation();
            const word = vocabulary[index];
            const content = mode === 'es-ja' ? word.es : word.ja;
            const lang = mode === 'es-ja' ? 'es-ES' : 'ja-JP';
            speak(content, lang);
        });

        document.getElementById('speak-back').addEventListener('click', (e) => {
            e.stopPropagation();
            const word = vocabulary[index];
            const content = mode === 'es-ja' ? word.ja : word.es;
            const lang = mode === 'es-ja' ? 'ja-JP' : 'es-ES';
            speak(content, lang);
        });

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchSheetData();
        });
    </script>
</body>

</html>
