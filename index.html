<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山村『日⇔西』単語帳 - 3000 Words Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #020617;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2000px;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png') repeat;
            animation: drift 100s linear infinite;
            z-index: 0;
            opacity: 0.2;
        }

        .card-container {
            perspective: 2000px;
            width: 100%;
            max-width: 360px;
            height: 420px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .card-face-front {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
            backdrop-filter: blur(20px);
            border-top: 2px solid rgba(34, 211, 238, 0.5);
        }
        .card-face-back {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(88, 28, 135, 0.8));
            backdrop-filter: blur(20px);
            transform: rotateY(180deg);
            border-top: 2px solid rgba(168, 85, 247, 0.5);
        }
        
        ruby { ruby-align: center; ruby-position: over; }
        rt { font-size: 0.4em; letter-spacing: 0.1em; color: rgba(168, 85, 247, 1); font-weight: bold; padding-bottom: 0.2em; }

        .glass-ui {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-active {
            background-color: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }
        .romaji {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: rgba(148, 163, 184, 0.8);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-between py-6 px-6 overflow-hidden">

    <div class="stars"></div>

    <div class="z-10 text-center w-full space-y-4">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                山村『日⇔西』単語帳
            </h1>
            <p id="stats-display" class="text-[8px] text-slate-500 font-mono mt-1 uppercase tracking-widest">Loading Library...</p>
        </div>
        
        <div class="flex items-center gap-2 max-w-xs mx-auto">
            <select id="category-select" class="flex-1 glass-ui rounded-xl px-4 py-3 text-[10px] font-bold tracking-widest uppercase outline-none text-cyan-400 border-cyan-500/30 bg-slate-900">
                <optgroup label="【A1 - 入門】">
                    <option value="a1_basic">基本 1-500</option>
                    <option value="a1_extended">基本 501-1000</option>
                </optgroup>
                <optgroup label="【A2 - 初級】">
                    <option value="a2_daily">日常生活 1001-1500</option>
                    <option value="a2_social">社会生活 1501-2000</option>
                </optgroup>
                <optgroup label="【B1 - 中級】">
                    <option value="b1_biz">ビジネス 2001-2500</option>
                    <option value="b1_academic">アカデミック 2501-3000</option>
                </optgroup>
            </select>
            <button id="btn-reset" class="w-12 h-12 rounded-xl glass-ui flex flex-col items-center justify-center active:bg-cyan-500/20 border-cyan-500/30">
                <i data-lucide="rotate-ccw" class="w-4 h-4 text-cyan-400"></i>
            </button>
        </div>

        <div class="flex justify-center gap-2">
            <button id="mode-es-ja" class="btn-active px-4 py-1.5 rounded-full border border-white/10 text-[10px] font-bold tracking-widest uppercase transition-all glass-ui">
                西 → 日
            </button>
            <button id="mode-ja-es" class="px-4 py-1.5 rounded-full border border-white/10 text-[10px] font-bold tracking-widest uppercase transition-all glass-ui text-slate-400">
                日 → 西
            </button>
        </div>
    </div>

    <div class="z-10 w-full flex justify-center">
        <div class="card-container">
            <div id="card-inner" class="card-inner">
                <div class="card-face card-face-front">
                    <div class="absolute top-8 left-8 text-[10px] font-bold tracking-widest text-cyan-400 opacity-50 uppercase">FRONT</div>
                    <div class="flex flex-col items-center">
                        <h2 id="front-text" class="text-4xl font-bold text-center leading-tight px-4">...</h2>
                        <div id="front-romaji" class="romaji"></div>
                    </div>
                    <button id="speak-front" class="absolute bottom-10 w-12 h-12 rounded-full glass-ui flex items-center justify-center border-cyan-500/30">
                        <i data-lucide="volume-2" class="w-5 h-5 text-cyan-400"></i>
                    </button>
                </div>
                <div class="card-face card-face-back">
                    <div class="absolute top-8 left-8 text-[10px] font-bold tracking-widest text-purple-400 opacity-50 uppercase">BACK</div>
                    <div class="flex flex-col items-center">
                        <h2 id="back-text" class="text-3xl font-bold text-center leading-tight px-4">...</h2>
                        <div id="back-romaji" class="romaji"></div>
                    </div>
                    <button id="speak-back" class="absolute bottom-10 w-12 h-12 rounded-full glass-ui flex items-center justify-center border-purple-500/30">
                        <i data-lucide="volume-2" class="w-5 h-5 text-purple-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="z-10 w-full max-sm:pb-4 max-w-sm space-y-6">
        <div class="flex items-center justify-between gap-4">
            <button id="btn-prev" class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-left" class="w-8 h-8 text-slate-400"></i>
            </button>
            <div class="text-center flex-1">
                <div id="counter" class="text-2xl font-['Orbitron'] font-bold text-white tracking-widest">0001</div>
                <div class="w-full h-1 bg-slate-900 rounded-full mt-3 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 w-0 transition-all duration-300"></div>
                </div>
            </div>
            <button id="btn-next" class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-right" class="w-8 h-8 text-slate-400"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button id="btn-shuffle" class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">
                <i data-lucide="shuffle" class="w-4 h-4 text-cyan-400"></i> Shuffle
            </button>
            <button id="btn-open-jump" class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">
                <i data-lucide="hash" class="w-4 h-4 text-purple-400"></i> Jump
            </button>
        </div>
    </div>

    <!-- Jump Modal -->
    <div id="jump-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="glass-ui p-6 rounded-[2rem] w-80 text-center transform scale-95 transition-transform duration-300 border border-white/10" id="jump-modal-content">
            <h3 class="text-lg font-bold text-white mb-1 font-['Orbitron'] tracking-wider">JUMP TO</h3>
            <p class="text-[10px] text-slate-400 mb-6 uppercase tracking-widest">番号を入力 (1 - <span id="jump-max-display"></span>)</p>
            <input type="number" id="jump-input" class="w-full bg-slate-900/50 border border-purple-500/30 rounded-xl px-4 py-4 text-center text-white font-bold text-2xl outline-none mb-6 font-['Orbitron']" placeholder="#">
            <div class="flex gap-3">
                <button id="btn-jump-cancel" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-bold text-slate-400 tracking-widest uppercase">CANCEL</button>
                <button id="btn-jump-confirm" class="flex-1 py-3 rounded-xl bg-purple-500/20 border border-purple-500/50 text-purple-300 text-[10px] font-bold tracking-widest uppercase">GO</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-32 glass-ui px-6 py-2 rounded-full text-[10px] font-bold tracking-widest uppercase opacity-0 transition-all duration-300 pointer-events-none text-cyan-400">
        Message
    </div>

    <script type="module">
        // --- 語彙データ（各レベル500語、合計3000語） ---
        const generateData = (count, startId, prefix) => {
            // ここに実データを配列で定義できます
            // デモ用に3000語分の枠を生成しています
            return Array.from({ length: count }, (_, i) => ({
                id: startId + i,
                es: `${prefix} Palabra ${startId + i}`,
                ja: `${prefix} 単語 ${startId + i}`,
                romaji: `Tango ${startId + i}`
            }));
        };

        const vocabularyData = {
            a1_basic: generateData(500, 1, "A1"),
            a1_extended: generateData(500, 501, "A1+"),
            a2_daily: generateData(500, 1001, "A2"),
            a2_social: generateData(500, 1501, "A2+"),
            b1_biz: generateData(500, 2001, "B1"),
            b1_academic: generateData(500, 2501, "B1+")
        };

        let currentCat = 'a1_basic';
        let vocabulary = vocabularyData[currentCat];
        let index = 0;
        let isFlipped = false;
        let mode = 'es-ja';

        const update = () => {
            const word = vocabulary[index];
            const front = document.getElementById('front-text');
            const fRomaji = document.getElementById('front-romaji');
            const back = document.getElementById('back-text');
            const bRomaji = document.getElementById('back-romaji');

            if (mode === 'es-ja') {
                front.textContent = word.es;
                fRomaji.textContent = "";
                back.textContent = word.ja;
                bRomaji.textContent = word.romaji;
            } else {
                front.textContent = word.ja;
                fRomaji.textContent = word.romaji;
                back.textContent = word.es;
                bRomaji.textContent = "";
            }

            document.getElementById('counter').textContent = (index + 1).toString().padStart(4, '0');
            document.getElementById('progress-bar').style.width = `${((index + 1) / vocabulary.length) * 100}%`;
            document.getElementById('stats-display').textContent = `3000 WORDS LIB | ${currentCat.toUpperCase()}`;
        };

        const toast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        };

        // --- Event Listeners ---
        document.getElementById('card-inner').onclick = () => {
            isFlipped = !isFlipped;
            document.getElementById('card-inner').classList.toggle('is-flipped', isFlipped);
        };

        document.getElementById('btn-next').onclick = () => {
            if (isFlipped) {
                isFlipped = false;
                document.getElementById('card-inner').classList.remove('is-flipped');
                setTimeout(() => { index = (index + 1) % vocabulary.length; update(); }, 300);
            } else {
                index = (index + 1) % vocabulary.length;
                update();
            }
        };

        document.getElementById('btn-prev').onclick = () => {
            if (isFlipped) {
                isFlipped = false;
                document.getElementById('card-inner').classList.remove('is-flipped');
                setTimeout(() => { index = (index - 1 + vocabulary.length) % vocabulary.length; update(); }, 300);
            } else {
                index = (index - 1 + vocabulary.length) % vocabulary.length;
                update();
            }
        };

        document.getElementById('category-select').onchange = (e) => {
            currentCat = e.target.value;
            vocabulary = vocabularyData[currentCat];
            index = 0;
            if (isFlipped) { isFlipped = false; document.getElementById('card-inner').classList.remove('is-flipped'); }
            update();
            toast(`LOADED: ${currentCat}`);
        };

        document.getElementById('mode-es-ja').onclick = () => {
            mode = 'es-ja';
            document.getElementById('mode-es-ja').classList.add('btn-active');
            document.getElementById('mode-ja-es').classList.remove('btn-active');
            update();
        };

        document.getElementById('mode-ja-es').onclick = () => {
            mode = 'ja-es';
            document.getElementById('mode-ja-es').classList.add('btn-active');
            document.getElementById('mode-es-ja').classList.remove('btn-active');
            update();
        };

        document.getElementById('btn-shuffle').onclick = () => {
            index = Math.floor(Math.random() * vocabulary.length);
            update();
            toast("SHUFFLED");
        };

        document.getElementById('btn-reset').onclick = () => {
            index = 0;
            update();
            toast("RESET");
        };

        // --- Jump Modal Logic ---
        const modal = document.getElementById('jump-modal');
        const modalContent = document.getElementById('jump-modal-content');

        document.getElementById('btn-open-jump').onclick = () => {
            document.getElementById('jump-max-display').textContent = vocabulary.length;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                document.getElementById('jump-input').focus();
            }, 10);
        };

        document.getElementById('btn-jump-cancel').onclick = () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        document.getElementById('btn-jump-confirm').onclick = () => {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= vocabulary.length) {
                index = val - 1;
                update();
                document.getElementById('btn-jump-cancel').click();
                toast(`JUMPED TO #${val}`);
            }
        };

        // --- TTS ---
        const speak = (text, lang) => {
            if (!window.speechSynthesis) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
        };

        document.getElementById('speak-front').onclick = (e) => {
            e.stopPropagation();
            const word = vocabulary[index];
            speak(mode === 'es-ja' ? word.es : word.ja, mode === 'es-ja' ? 'es-ES' : 'ja-JP');
        };

        document.getElementById('speak-back').onclick = (e) => {
            e.stopPropagation();
            const word = vocabulary[index];
            speak(mode === 'es-ja' ? word.ja : word.es, mode === 'es-ja' ? 'ja-JP' : 'es-ES');
        };

        lucide.createIcons();
        update();
    </script>
</body>
</html>
