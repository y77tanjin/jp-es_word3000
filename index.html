    <title>山村『日⇔西』単語帳 - 3000 Words Edition</title>
    
    <!-- オリジナルファビコンの設定 -->
    <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=download&id=180AQNCjqhxGQ2xFPOaMOFtZ12Bn4Lq-L">
    <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=download&id=180AQNCjqhxGQ2xFPOaMOFtZ12Bn4Lq-L">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #020617;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2000px;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/1231630/stars.png') repeat;
            animation: drift 100s linear infinite;
            z-index: 0;
            opacity: 0.2;
        }

        .card-container {
            perspective: 2000px;
            width: 100%;
            max-width: 360px;
            height: 420px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .card-face-front {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
            backdrop-filter: blur(20px);
            border-top: 2px solid rgba(34, 211, 238, 0.5);
        }
        .card-face-back {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(88, 28, 135, 0.8));
            backdrop-filter: blur(20px);
            transform: rotateY(180deg);
            border-top: 2px solid rgba(168, 85, 247, 0.5);
        }
        
        ruby { ruby-align: center; ruby-position: over; }
        rt { font-size: 0.4em; letter-spacing: 0.1em; color: rgba(168, 85, 247, 1); font-weight: bold; padding-bottom: 0.2em; }

        .glass-ui {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-active {
            background-color: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }
        .romaji {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: rgba(148, 163, 184, 0.8);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-between py-6 px-6 overflow-hidden">

    <div class="stars"></div>

    <div class="z-10 text-center w-full space-y-4">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                山村『日⇔西』単語帳
            </h1>
            <p id="stats-display" class="text-[8px] text-slate-500 font-mono mt-1 uppercase tracking-widest">Loading Library...</p>
        </div>

                <optgroup label="【A1 - 入門】">
                    <option value="a1_basic">基本 1-500</option>
                    <option value="a1_extended">基本 501-1000</option>
                </optgroup>
                <optgroup label="【A2 - 初級】">
                    <option value="a2_daily">日常生活 1001-1500</option>
                    <option value="a2_social">社会生活 1501-2000</option>
                </optgroup>
                <optgroup label="【B1 - 中級】">
                    <option value="b1_biz">ビジネス 2001-2500</option>
                    <option value="b1_academic">アカデミック 2501-3000</option>
                </optgroup>
                <optgroup label="【機能別】">
                    <option value="func_exp">表現・熟語</option>
                </optgroup>
            </select>
            <button id="btn-reset" class="w-12 h-12 rounded-xl glass-ui flex flex-col items-center justify-center active:bg-cyan-500/20 border-cyan-500/30">
                <i data-lucide="rotate-ccw" class="w-4 h-4 text-cyan-400"></i>
            </button>
        </div>

        <div class="flex justify-center gap-2">
            <button id="mode-es-ja" class="btn-active px-4 py-1.5 rounded-full border border-white/10 text-[10px] font-bold tracking-widest uppercase transition-all glass-ui">

                日 → 西
            </button>
        </div>
    </div>

                    <button id="speak-front" class="absolute bottom-10 w-12 h-12 rounded-full glass-ui flex items-center justify-center border-cyan-500/30 active:scale-95 transition-transform">

                    </button>
                </div>
                <div class="card-face card-face-back">

                        <i data-lucide="volume-2" class="w-5 h-5 text-purple-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="z-10 w-full max-sm:pb-4 max-w-sm space-y-6">
        <div class="flex items-center justify-between gap-4">
            <button id="btn-prev" class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-left" class="w-8 h-8 text-slate-400"></i>
            </button>
            <div class="text-center flex-1">

                <div class="w-full h-1 bg-slate-900 rounded-full mt-3 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 w-0 transition-all duration-300"></div>
                </div>
            </div>
            <button id="btn-next" class="w-16 h-16 rounded-3xl glass-ui flex items-center justify-center active:scale-90 transition-all">
                <i data-lucide="chevron-right" class="w-8 h-8 text-slate-400"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button id="btn-shuffle" class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">

            </button>
            <button id="btn-open-jump" class="py-4 rounded-2xl glass-ui flex items-center justify-center gap-2 text-[10px] font-bold tracking-widest uppercase active:scale-95 transition-all">
                <i data-lucide="hash" class="w-4 h-4 text-purple-400"></i> Jump
            </button>
        </div>
    </div>

    <!-- ジャンプモーダル -->

            <p class="text-[10px] text-slate-400 mb-6 uppercase tracking-widest">番号を入力 (1 - <span id="jump-max-display"></span>)</p>
            <input type="number" id="jump-input" class="w-full bg-slate-900/50 border border-purple-500/30 rounded-xl px-4 py-4 text-center text-white font-bold text-2xl outline-none mb-6 font-['Orbitron']" placeholder="#">
            <div class="flex gap-3">

            </div>
        </div>
    </div>

  { id: 99, es: "Una sandia", ja: "<ruby>スイカ<rt>すいか</rt></ruby>", romaji: "Suika" },
  { id: 100, es: "Una pina", ja: "<ruby>パイナップル<rt>ぱいなっぷる</rt></ruby>", romaji: "Painappuru" },
  { id: 101, es: "Mercado", ja: "<ruby>市場<rt>いちば</rt></ruby>", romaji: "Ichiba" },
  { id: 102, es: "Una bolsa", ja: "<ruby>袋<rt>ふくろ</rt></ruby>", romaji: "Fukuro" },
  { id: 103, es: "Necesito (as)", ja: "<ruby>必要<rt>ひつよう</rt>　自分と他人</ruby>", romaji: "Hitsuyou" },
  { id: 104, es: "Durazno", ja: "<ruby>もも<rt>もも</rt></ruby>", romaji: "Momo" },
  { id: 105, es: "Cuanto cuesta", ja: "<ruby>いくら？<rt>いくら？</rt></ruby>", romaji: "Ikura?" },
  { id: 106, es: "Mas", ja: "<ruby>もっと<rt>もっと</rt></ruby>", romaji: "Motto" },
  { id: 107, es: "Botella", ja: "<ruby>ボトル（女）<rt>ぼとる</rt></ruby>", romaji: "Botoru" },
  { id: 108, es: "Naranja", ja: "<ruby>オレンジ<rt>おれんじ</rt></ruby>", romaji: "Orenji" },
  { id: 109, es: "Pinas", ja: "<ruby>パイナップル（女）<rt>ぱいなっぷる</rt></ruby>", romaji: "Painappuru" },
  { id: 110, es: "Cuanto cuestan", ja: "<ruby>いくらですか？<rt>いくらですか？</rt></ruby>", romaji: "Ikura desu ka?" },
  { id: 111, es: "Este", ja: "<ruby>この・このような<rt>この・このような</rt></ruby>", romaji: "Kono / Kono you na" }
],
                a1_extended: [
                    { id: 501, es: "Viaje", ja: "<ruby>旅行<rt>りょこう</rt></ruby>", romaji: "Ryokou" },
                    { id: 502, es: "Amigo", ja: "<ruby>友達<rt>ともだち</rt></ruby>", romaji: "Tomodachi" },
                    { id: 503, es: "Tiempo", ja: "<ruby>時間<rt>じかん</rt></ruby>", romaji: "Jikan" }
                ],
                a2_daily: [
                    { id: 1001, es: "Desayuno", ja: "<ruby>朝食<rt>ちょうしょく</rt></ruby>", romaji: "Choushoku" },
                    { id: 1002, es: "Trabajo", ja: "<ruby>仕事<rt>しごと</rt></ruby>", romaji: "Shigoto" }
                ],
                a2_social: [
                    { id: 1501, es: "Sociedad", ja: "<ruby>社会<rt>しゃかい</rt></ruby>", romaji: "Shakai" }
                ],
                b1_biz: [
                    { id: 2001, es: "Empresa", ja: "<ruby>会社<rt>かいしゃ</rt></ruby>", romaji: "Kaisha" },
                    { id: 2002, es: "Inversión", ja: "<ruby>投資<rt>とうし</rt></ruby>", romaji: "Toushi" }
                ],
                b1_academic: [
                    { id: 2501, es: "Investigación", ja: "<ruby>研究<rt>けんきゅう</rt></ruby>", romaji: "Kenkyuu" }
                ],
                func_exp: [
                    { id: 3001, es: "Tal vez", ja: "<ruby>多分<rt>たぶん</rt></ruby>", romaji: "Tabun" },
                    { id: 3002, es: "Por supuesto", ja: "<ruby>勿論<rt>もちろん</rt></ruby>", romaji: "Mochiron" }
                ]
            };

            const fillMissing = (dataMap) => {
                const counts = { a1_basic: 500, a1_extended: 500, a2_daily: 500, a2_social: 500, b1_biz: 500, b1_academic: 500, func_exp: 200 };
                const ranges = { a1_basic: 1, a1_extended: 501, a2_daily: 1001, a2_social: 1501, b1_biz: 2001, b1_academic: 2501, func_exp: 3001 };
                
                Object.keys(counts).forEach(cat => {
                    const targetCount = counts[cat];
                    const currentCount = dataMap[cat].length;
                    if (currentCount < targetCount) {
                        for (let i = currentCount; i < targetCount; i++) {
                            const id = ranges[cat] + i;
                            dataMap[cat].push({
                                id: id,
                                es: `Palabra ${id}`,
                                ja: `<ruby>単語<rt>たんご</rt></ruby> ${id}`,
                                romaji: `Tango ${id}`
                            });
                        }
                    }
                });
                return dataMap;
            };

            const vocabularyData = fillMissing(rawVocabulary);
            let currentCat = 'a1_basic';
            let vocabulary = vocabularyData[currentCat];
            let index = 0;
            let isFlipped = false;
            let mode = 'es-ja';

            const update = () => {
                const word = vocabulary[index];
                if (!word) return;

                const frontText = document.getElementById('front-text');
                const frontRomaji = document.getElementById('front-romaji');
                const backText = document.getElementById('back-text');
                const backRomaji = document.getElementById('back-romaji');

                if (mode === 'es-ja') {
                    frontText.innerHTML = word.es;
                    frontRomaji.textContent = "";
                    backText.innerHTML = word.ja;
                    backRomaji.textContent = word.romaji;
                } else {
                    frontText.innerHTML = word.ja;
                    frontRomaji.textContent = word.romaji;
                    backText.innerHTML = word.es;
                    backRomaji.textContent = "";
                }

                document.getElementById('counter').textContent = (index + 1).toString().padStart(4, '0');
                document.getElementById('progress-bar').style.width = `${((index + 1) / vocabulary.length) * 100}%`;
                document.getElementById('stats-display').textContent = `3000 WORDS LIB | ${currentCat.toUpperCase()}`;
            };

            const toast = (msg) => {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 2000);
            };

            const getSpeakText = (htmlContent, isJapanese) => {
                const temp = document.createElement('div');
                temp.innerHTML = htmlContent;
                if (!isJapanese) return temp.textContent;
                let speakable = "";
                temp.childNodes.forEach(node => {
                    if (node.nodeName === 'RUBY') {
                        const rt = node.querySelector('rt');
                        speakable += rt ? rt.textContent : node.textContent;
                    } else {
                        speakable += node.textContent;
                    }
                });
                return speakable || temp.textContent;
            };

            const speak = (rawHtml, lang) => {
                if (!window.speechSynthesis) { toast("TTS NOT SUPPORTED"); return; }
                window.speechSynthesis.cancel();
                const textToSpeak = getSpeakText(rawHtml, lang === 'ja-JP');
                const u = new SpeechSynthesisUtterance(textToSpeak);
                u.lang = lang;
                u.rate = 0.9;
                window.speechSynthesis.speak(u);
                toast("SPEAKING...");
            };

            document.getElementById('card-inner').addEventListener('click', () => {
                isFlipped = !isFlipped;
                document.getElementById('card-inner').classList.toggle('is-flipped', isFlipped);
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                if (isFlipped) {
                    isFlipped = false;
                    document.getElementById('card-inner').classList.remove('is-flipped');
                    setTimeout(() => { index = (index + 1) % vocabulary.length; update(); }, 300);
                } else { index = (index + 1) % vocabulary.length; update(); }
            });

            document.getElementById('btn-prev').addEventListener('click', () => {
                if (isFlipped) {
                    isFlipped = false;
                    document.getElementById('card-inner').classList.remove('is-flipped');
                    setTimeout(() => { index = (index - 1 + vocabulary.length) % vocabulary.length; update(); }, 300);
                } else { index = (index - 1 + vocabulary.length) % vocabulary.length; update(); }
            });

            document.getElementById('category-select').addEventListener('change', (e) => {
                currentCat = e.target.value;
                vocabulary = vocabularyData[currentCat];
                index = 0;
                if (isFlipped) { isFlipped = false; document.getElementById('card-inner').classList.remove('is-flipped'); }
                update();
                toast(`LOADED: ${currentCat}`);
            });

            document.getElementById('mode-es-ja').addEventListener('click', () => {
                mode = 'es-ja';
                document.getElementById('mode-es-ja').classList.add('btn-active');
                document.getElementById('mode-ja-es').classList.remove('btn-active');
                update();
            });

            document.getElementById('mode-ja-es').addEventListener('click', () => {
                mode = 'ja-es';
                document.getElementById('mode-ja-es').classList.add('btn-active');
                document.getElementById('mode-es-ja').classList.remove('btn-active');
                update();
            });

            document.getElementById('btn-shuffle').addEventListener('click', () => {
                index = Math.floor(Math.random() * vocabulary.length);
                update();
                toast("SHUFFLED");
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                index = 0;
                update();
                toast("RESET");
            });

            const modal = document.getElementById('jump-modal');
            const modalContent = document.getElementById('jump-modal-content');
            
            document.getElementById('btn-open-jump').addEventListener('click', () => {
                document.getElementById('jump-max-display').textContent = vocabulary.length;
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                    document.getElementById('jump-input').focus();
                }, 10);
            });

            document.getElementById('btn-jump-cancel').addEventListener('click', () => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            });

            document.getElementById('btn-jump-confirm').addEventListener('click', () => {
                const val = parseInt(document.getElementById('jump-input').value);
                if (val >= 1 && val <= vocabulary.length) {
                    index = val - 1;
                    update();
                    document.getElementById('btn-jump-cancel').click();
                    toast(`JUMPED TO #${val}`);
                }
            });

            document.getElementById('speak-front').addEventListener('click', (e) => {
                e.stopPropagation();
                const word = vocabulary[index];
                const content = mode === 'es-ja' ? word.es : word.ja;
                const lang = mode === 'es-ja' ? 'es-ES' : 'ja-JP';
                speak(content, lang);
            });

            document.getElementById('speak-back').addEventListener('click', (e) => {
                e.stopPropagation();
                const word = vocabulary[index];
                const content = mode === 'es-ja' ? word.ja : word.es;
                const lang = mode === 'es-ja' ? 'ja-JP' : 'es-ES';
                speak(content, lang);
            });

            lucide.createIcons();
            update();
        });
    </script>
</body>
</html>
